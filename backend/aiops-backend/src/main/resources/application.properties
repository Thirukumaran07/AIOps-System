spring.application.name=aiops-backend

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/aiops_db
spring.datasource.username=apple
spring.datasource.password=23Cb059@@
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# JWT
jwt.secret=aiops-super-secret-key-for-jwt-token-must-be-at-least-256-bits-long-2024
jwt.expiration=86400000

# ML Service
ml.service.url=http://localhost:5000

# Scheduling
spring.task.scheduling.enabled=true

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

spring.main.allow-bean-definition-overriding=true

# ============================================================
# Self-Healing Configuration
# ============================================================

# Metric thresholds (numbers, no % sign)
healing.cpu.threshold=90
healing.memory.threshold=90
healing.disk.threshold=90
healing.network.threshold=90
healing.latency.threshold=200
healing.packet-loss.threshold=5

# Retry & Timeout settings
healing.network.retry-count=3
healing.latency.retry-count=3
healing.packet-loss.retry-count=3
healing.retry-delay-ms=1000
healing.command-timeout-seconds=5

# DRY-RUN mode: true = identify but do NOT terminate/delete
# Set to false only when you are ready for real automated remediation
healing.dry-run=true

# ---- CPU ----------------------------------------------------
# Comma-separated process names that must NEVER be terminated automatically
healing.cpu.safe-processes=java,postgres,postgresql,python,sshd,launchd,kernel_task,systemd,dockerd

# ---- Memory -------------------------------------------------
healing.memory.safe-processes=java,postgres,postgresql,python,sshd,launchd,kernel_task,systemd,dockerd

# ---- Disk ---------------------------------------------------
# Only .tmp and .log files under these directories may be cleaned automatically
healing.disk.safe-paths=/tmp,/var/tmp

# Safety: disabled by default
healing.network.process-remediation-enabled=false